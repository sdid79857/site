<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقعي الشخصي</title>
<style>
body{font-family:sans-serif;margin:0;background:#0f172a;color:white;text-align:center}
header{padding:80px 20px;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
h1{font-size:40px;margin:0}
p{color:#cbd5e1;font-size:18px}
.btn{display:inline-block;margin-top:20px;background:white;color:#6366f1;padding:14px 28px;border-radius:30px;text-decoration:none;font-weight:bold}
section{padding:40px 20px}
.card{background:#1e293b;margin:15px auto;padding:20px;border-radius:15px;max-width:400px}
</style>
</head>
<body>
<header>
<h1>أهلاً بك في موقعي 🚀</h1>
<p>هذا موقعي الأول على GitHub</p>
<a class="btn" href="#">تواصل معي</a>
</header>
<section>
<div class="card">✨ تصميم عصري وسريع</div>
<div class="card">📱 يشتغل على الجوال 100%</div>
<div class="card">⚡ جاهز للتطوير</div>
</section>
</body>
